### LlamaFactory DPO 训练配置

### ========== 模型配置 ==========
model_name_or_path: ../models/model_sft_merged
template: qwen

### ========== 微调方法 ==========
stage: dpo
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj,k_proj,o_proj,gate_proj,up_proj,down_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

### ========== 数据集配置 ==========
dataset: autoif_dpo
dataset_dir: ../configs  # 确保此目录下有 dataset_info.json 且包含 autoif_dpo
cutoff_len: 1024         
overwrite_cache: true
preprocessing_num_workers: 16

### ========== 输出配置 ==========
output_dir: ../models/model_c_dpo
logging_steps: 10
save_steps: 30                          
save_total_limit: 5
plot_loss: true
overwrite_output_dir: true

### ========== 训练超参数 ==========
per_device_train_batch_size: 1          
gradient_accumulation_steps: 8          
learning_rate: 3.0e-6                   
num_train_epochs: 5.0                   
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
bf16: true                             

### ========== 评估配置 (脚本中有，YAML 补充) ==========
val_size: 0.05
eval_strategy: steps
eval_steps: 30

### ========== DPO 特定参数 ==========
pref_beta: 0.05                         
pref_loss: sigmoid

### ========== 其他配置 ==========
report_to: none                        