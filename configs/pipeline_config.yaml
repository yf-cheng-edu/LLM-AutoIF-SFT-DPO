# AutoIF 完整流程配置文件

# ========== 模型配置 ==========
models:
  # 监督模型（用于数据生成）
  supervisor:
    name: "Qwen/Qwen2.5-7B-Instruct"  # 教师模型（本地vLLM部署）
    api_key: "EMPTY"  # vLLM默认
    local_path: "./models/teacher"  # 本地模型路径
  
  # 基础模型B（蒸馏后或直接使用）
  base_model:
    path: "./models/student"
    type: "qwen"  # Qwen2.5-1.5B
  
  # 目标模型路径
  output_paths:
    sft: "./models/model_c_sft"
    dpo: "./models/model_c_dpo"
    merged: "./models/model_merged"
    quantized: "./models/model_gptq_int4"

# ========== 数据配置 ==========
data:
  # 种子指令
  seed_instructions: "./sample_data/seed_instruction.txt"
  
  # 领域定制（根据你的场景修改）
  domain: "general"  # general, customer_service, technical, education, etc.
  
  # 数据量控制
  augmentation:
    instructions_per_seed: 50  # 每个种子指令生成多少个
    rft_samples: 5  # RFT采样次数
  
  query:
    sharegpt_path: "path/to/sharegpt"
    queries_per_instruction: 16
    min_query_length: 20
    max_query_length: 300
  
  # 质量控制阈值
  quality_thresholds:
    cross_validation_acc: 0.8  # 验证函数准确率
    min_functions: 3  # 最少验证函数数
    min_test_cases: 10  # 最少测试用例数
    quality_score: 8  # 最终质量评分阈值（0-10）
  
  # DPO配对
  dpo:
    positive_threshold: 0.5  # 正样本阈值
    negative_threshold: 0.0  # 负样本阈值
    samples_per_query: 2  # 每个查询采样数

# ========== 训练配置 ==========
training:
  # SFT配置
  sft:
    num_gpus: 1
    batch_size: 4
    gradient_accumulation: 4
    learning_rate: 5e-5
    epochs: 3
    max_length: 8192
    warmup_steps: 100
    weight_decay: 0.1
    lr_scheduler: "cosine"
    save_steps: 500
    precision: "fp16"  # bf16, fp16
  
  # DPO配置
  dpo:
    num_gpus: 1
    batch_size: 2
    gradient_accumulation: 4
    learning_rate: 5e-6
    epochs: 2
    max_length: 4096
    max_samples: 200000
    warmup_ratio: 0.1
    save_steps: 500
    precision: "fp16"
  
  # DeepSpeed配置
  deepspeed:
    config: "configs/ds_z3_config.json"
    zero_stage: 3

# ========== 量化配置 ==========
quantization:
  method: "gptq"  # gptq, awq, gguf
  
  gptq:
    bits: 4
    group_size: 128
    desc_act: true
    calibration_samples: 128
  
  awq:
    bits: 4
    group_size: 128
    zero_point: true
  
  gguf:
    type: "q4_k_m"  # q4_0, q4_k_m, q5_k_m, q8_0

# ========== RAG配置 ==========
rag:
  # Embedding模型
  embedding_model: "BAAI/bge-large-zh-v1.5"
  
  # 向量数据库
  vectorstore:
    type: "faiss"  # faiss, chroma, pinecone
    chunk_size: 500
    chunk_overlap: 50
  
  # 检索配置
  retrieval:
    top_k: 3
    search_type: "similarity"  # similarity, mmr
    score_threshold: 0.5
  
  # 知识库路径
  knowledge_base: "./knowledge_base"

# ========== 评估配置 ==========
evaluation:
  # 评估基准
  benchmarks:
    - "ifeval"  # 指令遵循评估
    - "custom"  # 自定义评估
  
  # 评估指标
  metrics:
    - "instruction_following_accuracy"
    - "retrieval_precision"
    - "answer_relevance"
    - "faithfulness"
    - "latency"
  
  # 测试集
  test_set: "./test_data/test_cases.json"
  
  # 输出路径
  output_dir: "./eval_results"

# ========== 日志配置 ==========
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  output_dir: "./logs"
  save_steps: 10

# ========== 其他配置 ==========
misc:
  # 随机种子
  seed: 42
  
  # 并行处理
  num_workers: 4
  
  # 超时设置
  timeout: 5  # 验证函数执行超时（秒）
  
  # 缓存
  use_cache: true
  cache_dir: "./cache"
